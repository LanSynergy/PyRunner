services:
  pyrunner:
    image: hasanaboulhasan/pyrunner:latest
    container_name: pyrunner

    ports:
      - "8000:8000"

    volumes:
      - pyrunner_data:/app/data

    environment:
      # REQUIRED (set these in Dokploy UI or .env)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY}

      # Django settings
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}

      # Email settings (optional)
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@pyrunner.local
      RESEND_API_KEY: ${RESEND_API_KEY}
      USE_RESEND: "False"

      # Worker settings
      Q_WORKERS: "2"

      # Gunicorn settings
      PORT: "8000"
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "120"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pyrunner_data:
